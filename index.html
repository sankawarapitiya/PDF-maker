<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1416" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Scan documents with your phone camera, recognise text (OCR) offline and export searchable PDFs." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DocScan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>DocScan OCR</title>
    <style>
      /* Launch splash: inline so it paints before any script loads and matches the native splash. */
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: radial-gradient(120vmax 120vmax at 50% 40%, #0D9488 0%, #0F766E 40%, #063F3B 100%);
        transition: opacity .35s ease, visibility .35s;
        font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: radial-gradient(90vmax 90vmax at 50% 44%, #063F3B 0%, #0B1416 70%); }
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .wrap { display: grid; justify-items: center; gap: 18px; transform: translateY(-4vh); }
      #splash .logo { position: relative; width: 112px; height: 112px; border-radius: 26px; overflow: hidden;
        box-shadow: 0 18px 40px rgba(2, 44, 42, .5); animation: pop .6s cubic-bezier(.2, .9, .3, 1.2) both; }
      #splash .logo img { width: 100%; height: 100%; display: block; }
      #splash .beam { position: absolute; left: 10%; right: 10%; height: 3px; border-radius: 3px; top: 30%;
        background: #FCD34D; box-shadow: 0 0 14px 3px rgba(245, 165, 36, .8); animation: scan 1.4s ease-in-out .3s infinite alternate; }
      #splash .word { font-size: 34px; font-weight: 800; letter-spacing: -.8px; color: #fff; animation: rise .5s .15s both; }
      #splash .word span { color: #5EEAD4; }
      #splash .tag { margin-top: -10px; font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
        color: rgba(255, 255, 255, .7); animation: rise .5s .25s both; }
      #splash .tag b { color: #F5A524; }
      #splash .bar { position: absolute; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 3px;
        border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
      #splash .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #5EEAD4;
        animation: load 1.1s ease-in-out infinite; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } }
      @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
      @keyframes scan { from { top: 22%; } to { top: 74%; } }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="DocScan is loading">
      <div class="wrap">
        <div class="logo"><img src="icons/icon.svg" alt="" /><i class="beam"></i></div>
        <div class="word">Doc<span>Scan</span></div>
        <div class="tag">Scan <b>·</b> Recognise <b>·</b> Share</div>
      </div>
      <div class="bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
